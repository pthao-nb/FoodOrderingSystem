
<div class="forgot-page">
  <div class="forgot-card">

    <div class="forgot-icon">
      <span>🔐</span>
    </div>

    <h2>{{ step === 1 ? 'Quên mật khẩu?' : 'Tạo mật khẩu mới' }}</h2>

    <p class="description" *ngIf="step === 1">
      Đừng lo lắng! Hãy xác nhận thông tin tài khoản để tiếp tục.
    </p>

    <p class="description" *ngIf="step === 2">
      Hãy nhập mật khẩu mới để bảo vệ tài khoản của bạn.
    </p>

    <div class="step-indicator">
      <div class="step-item" [class.active]="step >= 1">
        <span>1</span>
        <small>Xác nhận</small>
      </div>
      <div class="step-line" [class.active]="step >= 2"></div>
      <div class="step-item" [class.active]="step >= 2">
        <span>2</span>
        <small>Mật khẩu mới</small>
      </div>
    </div>

    <!-- BƯỚC 1 -->
    <form *ngIf="step === 1" (ngSubmit)="verifyAccount()">

      <div class="form-group">
        <label for="taikhoan">Tên tài khoản</label>
        <input
          type="text"
          id="taikhoan"
          name="taikhoan"
          [(ngModel)]="taikhoan"
          placeholder="Nhập tên tài khoản"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="dienthoaiKH">Số điện thoại</label>
        <input
          type="tel"
          id="dienthoaiKH"
          name="dienthoaiKH"
          [(ngModel)]="dienthoaiKH"
          placeholder="Nhập số điện thoại đã đăng ký"
          autocomplete="tel"
          required
        >
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit" class="submit-button" [disabled]="isLoading">
        {{ isLoading ? 'Đang kiểm tra...' : 'Xác nhận thông tin' }}
      </button>
    </form>

    <!-- BƯỚC 2 -->
    <form *ngIf="step === 2" (ngSubmit)="resetPassword()">

      <div class="form-group">
        <label for="matkhauMoi">Mật khẩu mới</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="matkhauMoi"
            name="matkhauMoi"
            [(ngModel)]="matkhauMoi"
            placeholder="Nhập mật khẩu mới"
            autocomplete="new-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
             @if (showPassword) {
              <span>👁</span>
            } @else {
              <span>👁</span>
            }
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="xacNhanMatKhau">Xác nhận mật khẩu</label>
        <div class="password-wrapper">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="xacNhanMatKhau"
            name="xacNhanMatKhau"
            [(ngModel)]="xacNhanMatKhau"
            placeholder="Nhập lại mật khẩu mới"
            autocomplete="new-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            (click)="showConfirmPassword = !showConfirmPassword"
            [attr.aria-label]="showConfirmPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
             @if (showPassword) {
              <span>👁</span>
            } @else {
              <span>👁</span>
            }
          </button>
        </div>
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button type="submit" class="submit-button" [disabled]="isLoading">
        {{ isLoading ? 'Đang cập nhật...' : 'Đổi mật khẩu' }}
      </button>

      <button type="button" class="back-button" (click)="goBack()">
        Quay lại bước trước
      </button>
    </form>

    <a routerLink="/login" class="back-login">
      ← Quay lại đăng nhập
    </a>

  </div>
</div>
