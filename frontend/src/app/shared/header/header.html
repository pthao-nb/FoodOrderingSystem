<header class="site-header">
  <div class="header-inner">

    <!-- Logo -->
    <div class="header-left">
      <a routerLink="/" class="brand-link" (click)="goHome()">
        <img
          src="/assets/img/logo.jpg"
          alt="Logo Ăn Húp Hội"
          class="brand-logo"
        />

        <div class="brand-text">
          <span class="brand-name">Ăn Húp Hội</span>
          <small class="brand-slogan">Deals &amp; Món ngon</small>
        </div>
      </a>
    </div>

    <!-- Menu và tìm kiếm -->
    <div class="header-center">
      <nav class="main-nav">
        <ul class="nav-list">
          <li>
            <a routerLink="/" (click)="goHome()">Trang chủ</a>
          </li>
          <li><a routerLink="/menu">Thực đơn</a></li>
          <li><a routerLink="/deals">Khuyến mãi</a></li>
        </ul>
      </nav>

      <div class="search-wrap">
        <input
          type="search"
          class="search-input"
          placeholder="Tìm món..."
          aria-label="Tìm kiếm món ăn"
        />

        <button class="search-btn" type="button" aria-label="Tìm kiếm">
          🔍
        </button>
      </div>
    </div>

    <!-- Các nút bên phải -->
    <div class="header-right">
      <a routerLink="/cart" class="btn-ghost cart-btn" aria-label="Giỏ hàng">
        🛒
      </a>

      <a routerLink="/login" class="btn btn-primary">
        Đăng nhập
      </a>

      <button
        type="button"
        class="mobile-toggle"
        aria-label="Mở menu"
        (click)="toggleMobileMenu()"
      >
        ☰
      </button>
    </div>
  </div>

  <!-- Menu mobile -->
  @if (mobileMenuOpen) {
    <div class="mobile-menu">
      <button
        type="button"
        class="mobile-close"
        (click)="closeMobileMenu()"
      >
        ✕
      </button>

      <nav class="mobile-nav">
        <a routerLink="/" (click)="closeMobileMenu()">Trang chủ</a>
        <a routerLink="/menu" (click)="closeMobileMenu()">Thực đơn</a>
        <a routerLink="/deals" (click)="closeMobileMenu()">Khuyến mãi</a>
        <a routerLink="/login" (click)="closeMobileMenu()">Đăng nhập</a>
      </nav>
    </div>
  }
</header>
