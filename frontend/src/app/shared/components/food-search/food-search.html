<form class="search-wrap" (ngSubmit)="submit()" (focusout)="focusout($event)" role="search" autocomplete="off">
  <input class="search-input" type="search" name="keyword" [(ngModel)]="keyword" (ngModelChange)="changed()"
    (focus)="changed()" (keydown)="keydown($event)" maxlength="150" placeholder="Tìm món..."
    aria-label="Tìm kiếm món ăn" role="combobox" aria-autocomplete="list" [attr.aria-expanded]="open()"
    [attr.aria-controls]="idPrefix() + '-suggestions'"
    [attr.aria-activedescendant]="activeIndex() >= 0 ? idPrefix() + '-option-' + activeIndex() : null" />
  <button class="search-btn" type="submit" aria-label="Tìm kiếm">🔍</button>
  @if (open()) {
    <div class="suggestion-panel">
      @if (loading()) { <p role="status">Đang tìm món...</p> }
      @else if (failed()) { <p role="status">Chưa tải được gợi ý. Nhấn Enter để tìm kiếm.</p> }
      @else if (!suggestions().length) { <p role="status">Không tìm thấy món phù hợp.</p> }
      <ul [id]="idPrefix() + '-suggestions'" role="listbox" aria-label="Món ăn gợi ý">
        @for (food of suggestions(); track food.foodId; let i = $index) {
          <li role="option" [id]="idPrefix() + '-option-' + i" [attr.aria-selected]="activeIndex() === i">
            <button type="button" [class.active]="activeIndex() === i" (click)="search(food.foodName)">
              <span>{{ food.foodName }}</span><small>{{ price(food.price) }}</small>
            </button>
          </li>
        }
      </ul>
    </div>
  }
</form>
